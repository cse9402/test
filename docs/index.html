<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>민원서비스 찾기</title>
<meta name="description" content="민원서비스 목록을 서비스명 키워드와 민원분야로 검색·필터할 수 있는 안내 페이지">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23144fbe'/%3E%3Ccircle cx='14' cy='14' r='6.5' fill='none' stroke='white' stroke-width='3'/%3E%3Cpath d='M19 19l6 6' stroke='white' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #f4f6f9;
    --surface: #ffffff;
    --surface-2: #eef2f7;
    --text: #1b1f26;
    --text-muted: #5b6573;
    --border: #d8dee7;
    --primary: #144fbe;
    --primary-ink: #ffffff;
    --primary-soft: #e6eefc;
    --focus: #ff9e1b;
    --ok: #0f7b4b;
    --ok-soft: #e3f4ec;
    --no: #9a3b12;
    --no-soft: #fbece4;
    --mark: #fff1a8;
    --shadow: 0 1px 2px rgba(16, 24, 40, .06), 0 1px 3px rgba(16, 24, 40, .08);
    --radius: 10px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1319; --surface: #171c24; --surface-2: #1f2631; --text: #e7ebf1; --text-muted: #9aa5b4;
      --border: #2d3644; --primary: #6c9cff; --primary-ink: #0b1220; --primary-soft: #1c2a44;
      --ok: #5fd39c; --ok-soft: #173327; --no: #ffab82; --no-soft: #3a2218; --mark: #5a4b00;
      --shadow: 0 1px 2px rgba(0,0,0,.4);
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f1319; --surface: #171c24; --surface-2: #1f2631; --text: #e7ebf1; --text-muted: #9aa5b4;
    --border: #2d3644; --primary: #6c9cff; --primary-ink: #0b1220; --primary-soft: #1c2a44;
    --ok: #5fd39c; --ok-soft: #173327; --no: #ffab82; --no-soft: #3a2218; --mark: #5a4b00;
    --shadow: 0 1px 2px rgba(0,0,0,.4);
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", system-ui, -apple-system, sans-serif;
    font-size: 16px; line-height: 1.55; word-break: keep-all;
  }
  .skip { position: absolute; left: -9999px; }
  .skip:focus { left: 16px; top: 8px; z-index: 10; background: var(--surface); padding: 8px 12px; border-radius: 6px; }
  :focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

  header.top { background: var(--surface); border-bottom: 1px solid var(--border); }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 0 16px; }
  .top .wrap { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-top: 14px; padding-bottom: 14px; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 15px; color: var(--text-muted); }
  .brand svg { flex: none; }
  .theme-btn {
    border: 1px solid var(--border); background: var(--surface); color: var(--text);
    border-radius: 8px; padding: 6px 10px; font: inherit; font-size: 14px; cursor: pointer;
  }

  .hero { padding: 28px 0 8px; }
  .hero h1 { margin: 0 0 6px; font-size: clamp(24px, 4vw, 32px); letter-spacing: -0.02em; }
  .hero p { margin: 0; color: var(--text-muted); }

  .panel {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    box-shadow: var(--shadow); padding: 18px; margin: 18px 0;
  }
  .search-row { display: grid; grid-template-columns: 1fr auto; gap: 10px; }
  label.lbl { display: block; font-weight: 700; font-size: 14px; margin-bottom: 6px; }
  .search-box { position: relative; }
  .search-box svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text-muted); pointer-events: none; }
  input[type="search"] {
    width: 100%; font: inherit; font-size: 17px; color: var(--text); background: var(--surface);
    border: 2px solid var(--border); border-radius: 8px; padding: 12px 14px 12px 44px;
  }
  input[type="search"]:focus { border-color: var(--primary); outline: none; box-shadow: 0 0 0 3px var(--primary-soft); }
  .reset-btn {
    align-self: end; font: inherit; font-weight: 600; border-radius: 8px; padding: 12px 16px; cursor: pointer;
    border: 1px solid var(--border); background: var(--surface-2); color: var(--text); min-height: 50px;
  }
  .reset-btn:hover { border-color: var(--primary); }

  fieldset { border: 0; margin: 16px 0 0; padding: 0; min-width: 0; }
  legend { font-weight: 700; font-size: 14px; margin-bottom: 8px; padding: 0; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip input { position: absolute; opacity: 0; pointer-events: none; }
  .chip span {
    display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; min-height: 40px;
    border: 1px solid var(--border); border-radius: 999px; background: var(--surface);
    font-size: 15px; cursor: pointer; user-select: none; transition: background .12s, border-color .12s;
  }
  .chip span small { color: var(--text-muted); font-size: 12px; }
  .chip:hover span { border-color: var(--primary); }
  .chip input:checked + span { background: var(--primary); border-color: var(--primary); color: var(--primary-ink); font-weight: 700; }
  .chip input:checked + span small { color: inherit; opacity: .85; }
  .chip input:focus-visible + span { outline: 3px solid var(--focus); outline-offset: 2px; }

  .sub-filters { display: flex; flex-wrap: wrap; gap: 12px 20px; margin-top: 16px; align-items: center; }
  .sub-filters label { display: inline-flex; align-items: center; gap: 8px; font-size: 15px; }
  select {
    font: inherit; font-size: 15px; color: var(--text); background: var(--surface);
    border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; min-height: 40px;
  }

  .result-bar { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 6px 16px; margin: 6px 0 12px; }
  .count { font-size: 17px; }
  .count strong { color: var(--primary); font-size: 22px; font-variant-numeric: tabular-nums; }
  .active-cond { color: var(--text-muted); font-size: 14px; }

  table { width: 100%; border-collapse: collapse; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); }
  caption { position: absolute; left: -9999px; }
  th, td { padding: 13px 14px; text-align: left; border-bottom: 1px solid var(--border); vertical-align: middle; }
  thead th { background: var(--surface-2); font-size: 14px; color: var(--text-muted); white-space: nowrap; }
  thead th button { all: unset; cursor: pointer; display: inline-flex; gap: 4px; align-items: center; }
  thead th button:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  thead th[aria-sort="ascending"] button::after { content: "▲"; font-size: 10px; }
  thead th[aria-sort="descending"] button::after { content: "▼"; font-size: 10px; }
  tbody tr:last-child td { border-bottom: 0; }
  tbody tr:hover { background: var(--surface-2); }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  td.name { font-weight: 700; }
  td.name .id { display: block; font-weight: 400; font-size: 12px; color: var(--text-muted); }
  mark { background: var(--mark); color: inherit; border-radius: 2px; padding: 0 1px; }
  .tag { display: inline-block; padding: 2px 10px; border-radius: 999px; background: var(--primary-soft); color: var(--primary); font-size: 13px; font-weight: 700; white-space: nowrap; }
  .badge { display: inline-flex; align-items: center; gap: 4px; padding: 2px 10px; border-radius: 6px; font-size: 13px; font-weight: 700; white-space: nowrap; }
  .badge.ok { background: var(--ok-soft); color: var(--ok); }
  .badge.no { background: var(--no-soft); color: var(--no); }

  .empty { text-align: center; padding: 40px 16px; color: var(--text-muted); }
  .empty strong { display: block; color: var(--text); font-size: 18px; margin-bottom: 4px; }

  footer { color: var(--text-muted); font-size: 13px; padding: 24px 0 40px; }
  footer a { color: var(--primary); }

  /* 모바일: 표를 카드형으로 전환 */
  @media (max-width: 760px) {
    .search-row { grid-template-columns: 1fr; }
    .reset-btn { min-height: 44px; }
    table, thead, tbody, tr, td { display: block; width: 100%; }
    table { border: 0; background: transparent; box-shadow: none; }
    thead { position: absolute; left: -9999px; }
    tbody tr {
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
      box-shadow: var(--shadow); margin-bottom: 12px; padding: 12px 14px;
      display: grid; grid-template-columns: 1fr 1fr; gap: 8px 12px;
    }
    tbody tr:hover { background: var(--surface); }
    td { border: 0; padding: 0; }
    td.name { grid-column: 1 / -1; font-size: 17px; }
    td[data-label]::before { content: attr(data-label); display: block; font-size: 12px; color: var(--text-muted); font-weight: 400; margin-bottom: 2px; }
    td.name::before { display: none !important; }
    td.num { text-align: left; }
    .empty { grid-column: 1 / -1; }
  }
</style>
</head>
<body>
<a class="skip" href="#results">검색 결과로 바로가기</a>

<header class="top">
  <div class="wrap">
    <div class="brand">
      <svg width="28" height="28" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="7" fill="#144fbe"/><circle cx="14" cy="14" r="6.5" fill="none" stroke="#fff" stroke-width="3"/><path d="M19 19l6 6" stroke="#fff" stroke-width="3" stroke-linecap="round"/></svg>
      민원서비스 안내
    </div>
    <button type="button" class="theme-btn" id="themeBtn" aria-label="화면 테마 전환">테마 전환</button>
  </div>
</header>

<main class="wrap">
  <section class="hero">
    <h1>민원서비스 찾기</h1>
    <p>찾으시는 민원의 이름을 입력하거나 민원분야를 선택하세요. 두 조건은 동시에 적용됩니다.</p>
  </section>

  <form class="panel" id="filters" role="search" onsubmit="return false">
    <div class="search-row">
      <div>
        <label class="lbl" for="q">서비스명 검색</label>
        <div class="search-box">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4" stroke-linecap="round"/></svg>
          <input type="search" id="q" name="q" placeholder="예: 여권, 발급, 등록" autocomplete="off" enterkeyhint="search">
        </div>
      </div>
      <button type="button" class="reset-btn" id="resetBtn">조건 초기화</button>
    </div>

    <fieldset>
      <legend>민원분야</legend>
      <div class="chips" id="fieldChips"></div>
    </fieldset>

    <div class="sub-filters">
      <label>온라인처리
        <select id="online">
          <option value="">전체</option>
          <option value="가능">가능</option>
          <option value="불가">불가</option>
        </select>
      </label>
      <label>정렬
        <select id="sort">
          <option value="id:asc">기본 순서</option>
          <option value="name:asc">서비스명 가나다순</option>
          <option value="days:asc">처리기한 짧은 순</option>
          <option value="fee:asc">수수료 낮은 순</option>
        </select>
      </label>
    </div>
  </form>

  <div class="result-bar">
    <p class="count" id="count" aria-live="polite" role="status"></p>
    <p class="active-cond" id="cond"></p>
  </div>

  <div id="results">
    <table>
      <caption>민원서비스 목록</caption>
      <thead>
        <tr>
          <th scope="col" data-key="name"><button type="button">서비스명</button></th>
          <th scope="col" data-key="org"><button type="button">소관기관</button></th>
          <th scope="col" data-key="field"><button type="button">민원분야</button></th>
          <th scope="col" data-key="online"><button type="button">온라인처리</button></th>
          <th scope="col" class="num" data-key="days"><button type="button">처리기한</button></th>
          <th scope="col" class="num" data-key="fee"><button type="button">수수료</button></th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>

  <footer>
    <p>자료: 민원서비스 목록(서비스ID S001~S022, 총 22건). 원본 데이터: <a href="data/services.csv">CSV</a> · <a href="data/services.json">JSON</a></p>
    <p>처리기한 0일은 ‘즉시’로 표시합니다. 실제 처리기한·수수료는 소관기관에 확인하시기 바랍니다.</p>
  </footer>
</main>

<script>
(function () {
  "use strict";

  var raw = JSON.parse(document.getElementById("service-data").textContent);
  var rows = raw.map(function (r) {
    return {
      id: r["서비스ID"], name: r["서비스명"], org: r["소관기관"], field: r["민원분야"],
      online: r["온라인처리"], days: Number(r["처리기한일"]), fee: Number(r["수수료"])
    };
  });
  var TOTAL = rows.length;

  // 민원분야 목록(원본 등장 순서 유지)
  var fields = [];
  rows.forEach(function (r) { if (fields.indexOf(r.field) < 0) fields.push(r.field); });

  var $ = function (id) { return document.getElementById(id); };
  var qEl = $("q"), chipsEl = $("fieldChips"), onlineEl = $("online"), sortEl = $("sort");
  var tbody = $("tbody"), countEl = $("count"), condEl = $("cond");

  var state = { q: "", field: "", online: "", sortKey: "id", sortDir: "asc" };

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  // 공백 무시 비교용 정규화
  function norm(s) { return String(s).toLowerCase().replace(/\s+/g, ""); }

  // 공백을 무시하고 일치 구간을 강조
  function highlight(text, q) {
    var nq = norm(q);
    if (!nq) return esc(text);
    var map = [], compact = "";
    for (var i = 0; i < text.length; i++) {
      if (!/\s/.test(text[i])) { map.push(i); compact += text[i].toLowerCase(); }
    }
    var at = compact.indexOf(nq);
    if (at < 0) return esc(text);
    var start = map[at], end = map[at + nq.length - 1] + 1;
    return esc(text.slice(0, start)) + "<mark>" + esc(text.slice(start, end)) + "</mark>" + esc(text.slice(end));
  }

  function fmtDays(d) { return d === 0 ? "즉시" : d + "일"; }
  function fmtFee(f) { return f === 0 ? "무료" : f.toLocaleString("ko-KR") + "원"; }

  function renderChips() {
    var html = chipOne("", "전체", TOTAL);
    fields.forEach(function (f) {
      var n = rows.filter(function (r) { return r.field === f; }).length;
      html += chipOne(f, f, n);
    });
    chipsEl.innerHTML = html;
  }
  function chipOne(value, label, n) {
    return '<label class="chip"><input type="radio" name="field" value="' + esc(value) + '"' +
      (state.field === value ? " checked" : "") + '><span>' + esc(label) + ' <small>' + n + '</small></span></label>';
  }

  function compare(a, b) {
    var k = state.sortKey, dir = state.sortDir === "desc" ? -1 : 1;
    var va = a[k], vb = b[k];
    var c = (typeof va === "number") ? va - vb : String(va).localeCompare(String(vb), "ko");
    if (c === 0) c = a.id.localeCompare(b.id);
    return c * dir;
  }

  function render() {
    var nq = norm(state.q);
    var list = rows.filter(function (r) {
      if (nq && norm(r.name).indexOf(nq) < 0) return false;
      if (state.field && r.field !== state.field) return false;
      if (state.online && r.online !== state.online) return false;
      return true;
    }).sort(compare);

    countEl.innerHTML = "전체 " + TOTAL + "건 중 <strong>" + list.length + "</strong>건 표시";

    var conds = [];
    if (state.q.trim()) conds.push("검색어 ‘" + esc(state.q.trim()) + "’");
    if (state.field) conds.push("분야 " + esc(state.field));
    if (state.online) conds.push("온라인처리 " + esc(state.online));
    condEl.innerHTML = conds.length ? "적용 조건: " + conds.join(" · ") : "";

    if (!list.length) {
      tbody.innerHTML = '<tr><td colspan="6" class="empty"><strong>조건에 맞는 민원서비스가 없습니다.</strong>검색어를 줄이거나 민원분야를 ‘전체’로 바꿔 보세요.</td></tr>';
    } else {
      tbody.innerHTML = list.map(function (r) {
        var ok = r.online === "가능";
        return "<tr>" +
          '<td class="name" data-label="서비스명">' + highlight(r.name, state.q) + '<span class="id">' + esc(r.id) + "</span></td>" +
          '<td data-label="소관기관">' + esc(r.org) + "</td>" +
          '<td data-label="민원분야"><span class="tag">' + esc(r.field) + "</span></td>" +
          '<td data-label="온라인처리"><span class="badge ' + (ok ? "ok" : "no") + '">' + (ok ? "● 가능" : "○ 불가") + "</span></td>" +
          '<td class="num" data-label="처리기한">' + fmtDays(r.days) + "</td>" +
          '<td class="num" data-label="수수료">' + fmtFee(r.fee) + "</td>" +
          "</tr>";
      }).join("");
    }

    document.querySelectorAll("thead th[data-key]").forEach(function (th) {
      if (th.dataset.key === state.sortKey) th.setAttribute("aria-sort", state.sortDir === "asc" ? "ascending" : "descending");
      else th.removeAttribute("aria-sort");
    });
    var sv = state.sortKey + ":" + state.sortDir;
    sortEl.value = Array.prototype.some.call(sortEl.options, function (o) { return o.value === sv; }) ? sv : "id:asc";

    syncUrl();
  }

  // 주소창에 조건 저장(링크 공유 가능)
  function syncUrl() {
    var p = new URLSearchParams();
    if (state.q.trim()) p.set("q", state.q.trim());
    if (state.field) p.set("field", state.field);
    if (state.online) p.set("online", state.online);
    var qs = p.toString();
    try { history.replaceState(null, "", qs ? "?" + qs : location.pathname); } catch (e) {}
  }
  function readUrl() {
    var p = new URLSearchParams(location.search);
    state.q = p.get("q") || "";
    var f = p.get("field") || "";
    state.field = fields.indexOf(f) >= 0 ? f : "";
    var o = p.get("online") || "";
    state.online = (o === "가능" || o === "불가") ? o : "";
    qEl.value = state.q;
    onlineEl.value = state.online;
  }

  qEl.addEventListener("input", function () { state.q = qEl.value; render(); });
  chipsEl.addEventListener("change", function (e) {
    if (e.target.name === "field") { state.field = e.target.value; render(); }
  });
  onlineEl.addEventListener("change", function () { state.online = onlineEl.value; render(); });
  sortEl.addEventListener("change", function () {
    var v = sortEl.value.split(":"); state.sortKey = v[0]; state.sortDir = v[1]; render();
  });
  document.querySelectorAll("thead th[data-key] button").forEach(function (btn) {
    btn.addEventListener("click", function () {
      var k = btn.parentNode.dataset.key;
      if (state.sortKey === k) state.sortDir = state.sortDir === "asc" ? "desc" : "asc";
      else { state.sortKey = k; state.sortDir = "asc"; }
      render();
    });
  });
  $("resetBtn").addEventListener("click", function () {
    state = { q: "", field: "", online: "", sortKey: "id", sortDir: "asc" };
    qEl.value = ""; onlineEl.value = "";
    renderChips(); render(); qEl.focus();
  });

  // 테마 전환
  var root = document.documentElement;
  try { var saved = localStorage.getItem("theme"); if (saved) root.setAttribute("data-theme", saved); } catch (e) {}
  $("themeBtn").addEventListener("click", function () {
    var cur = root.getAttribute("data-theme") ||
      (window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    var next = cur === "dark" ? "light" : "dark";
    root.setAttribute("data-theme", next);
    try { localStorage.setItem("theme", next); } catch (e) {}
  });

  readUrl();
  renderChips();
  render();
})();
</script>
</body>
</html>
