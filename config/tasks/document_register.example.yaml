# 문서등록 반복 작업 설정 예시
# 1) config/tasks/document_register.yaml 로 복사
# 2) playwright codegen 로 실제 화면을 녹화해 얻은 선택자로 TODO 부분을 채우세요.
#
# 각 행(step)의 action 종류:
#   click, fill, select, upload, check, uncheck, press,
#   wait_for_selector, wait_for_timeout, handle_dialog

task_name: document_register

start_url: "https://intra.eais.go.kr/namyangju/index.do"  # TODO: 로그인 후 실제 시작 화면 URL로 교체

# 폼 입력 전에 메뉴 클릭 등으로 문서등록 화면까지 이동하는 단계
steps_before_form:
  - action: click
    selector: "text=문서등록"          # TODO: 실제 메뉴 선택자로 교체
  - action: wait_for_selector
    selector: "#TODO_doc_register_form" # TODO: 문서등록 폼이 로드됐는지 확인할 선택자

# CSV의 각 컬럼을 화면의 어느 입력란에 넣을지 매핑
# csv_column 은 data/document_register_sample.csv 의 헤더와 일치해야 함
fields:
  - csv_column: title
    selector: "#TODO_title_input"       # TODO
    type: fill
  - csv_column: doc_type
    selector: "#TODO_doc_type_select"   # TODO
    type: select
  - csv_column: content
    selector: "#TODO_content_textarea"  # TODO
    type: fill
  - csv_column: attachment_path
    selector: "#TODO_file_input"        # TODO (파일 업로드 input[type=file])
    type: upload

# 폼 입력 후 제출 및 완료 확인 단계
steps_after_form:
  - action: click
    selector: "#TODO_submit_button"     # TODO
  - action: handle_dialog
    accept: true                        # 확인창(alert/confirm)이 뜨면 자동 확인
  - action: wait_for_selector
    selector: "#TODO_success_marker"    # TODO: 등록 완료를 나타내는 요소

# 위 요소가 나타나면 해당 행을 '성공'으로 기록
success_selector: "#TODO_success_marker"

# 각 행 처리 사이 대기 시간(초). 서버 부담을 줄이고 사람처럼 동작하도록 여유를 둡니다.
delay_between_rows_seconds: 3
