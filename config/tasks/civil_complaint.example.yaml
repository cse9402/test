# 민원처리 반복 작업 설정 예시 (문서등록과 동일한 구조)
# config/tasks/civil_complaint.yaml 로 복사 후 TODO를 실제 선택자로 교체하세요.

task_name: civil_complaint

start_url: "https://biz.blcm.go.kr/biz/cmm/main/mainPage.do"

steps_before_form:
  - action: click
    selector: "text=민원처리"           # TODO
  - action: wait_for_selector
    selector: "#TODO_complaint_form"    # TODO

fields:
  - csv_column: complaint_no
    selector: "#TODO_complaint_no_input" # TODO
    type: fill
  - csv_column: process_type
    selector: "#TODO_process_type_select" # TODO
    type: select
  - csv_column: answer_content
    selector: "#TODO_answer_textarea"    # TODO
    type: fill

steps_after_form:
  - action: click
    selector: "#TODO_submit_button"      # TODO
  - action: handle_dialog
    accept: true
  - action: wait_for_selector
    selector: "#TODO_success_marker"     # TODO

success_selector: "#TODO_success_marker"
delay_between_rows_seconds: 3
